<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101b2d">
    <title>Iniciar sesión | INCOROVA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="login-container">
        <section class="login-brand" aria-label="INCOROVA">
            <div class="brand-content">
                <div class="brand-symbol" aria-hidden="true">I</div>
                <span class="brand-kicker">GESTIÓN INTELIGENTE</span>
                <h1>INCOROVA</h1>
                <p>Control y gestión de operaciones de transporte en un solo lugar.</p>
                <div class="brand-line"></div>
                <span class="brand-caption">PLATAFORMA DE TRANSPORTES</span>
            </div>
            <div class="brand-decoration" aria-hidden="true"></div>
        </section>

        <section class="login-section">
            <div class="login-box">
                <div class="login-heading">
                    <span class="welcome-label">BIENVENIDO</span>
                    <h2>Iniciar sesión</h2>
                    <p>Ingresa tus credenciales para acceder a la plataforma.</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="nombre@empresa.com"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>

                    <button type="submit" id="loginButton">
                        <span id="buttonText">Ingresar a la plataforma</span>
                        <span class="button-arrow" aria-hidden="true">→</span>
                    </button>
                </form>

                <footer class="login-footer">
                    <span>INCOROVA</span>
                    <p>Acceso exclusivo para usuarios autorizados</p>
                </footer>
            </div>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
