<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plataforma de Transportes</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <main class="login-container">

        <section class="login-brand">

            <div class="brand-content">

                <div class="brand-symbol">PT</div>

                <h1>PLATAFORMA<br>DE TRANSPORTES</h1>

                <p>
                    Gestión, control y administración
                    de operaciones en un solo lugar.
                </p>

                <div class="brand-line"></div>

                <span>SISTEMA DE GESTIÓN EMPRESARIAL</span>

            </div>

        </section>

        <section class="login-section">

            <div class="login-box">

                <div class="login-heading">

                    <span class="welcome-label">
                        BIENVENIDO
                    </span>

                    <h2>Iniciar sesión</h2>

                    <p>
                        Ingresa tus credenciales para acceder
                        a la plataforma.
                    </p>

                </div>

                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="nombre@empresa.com"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Ingresa tu contraseña"
                            required
                        >

                    </div>

                    <div id="loginMessage" class="login-message"></div>

                    <button type="submit" id="loginButton">

                        <span id="buttonText">
                            Ingresar a la plataforma
                        </span>

                    </button>

                </form>

                <div class="login-footer">

                    <span>
                        Acceso exclusivo para personal autorizado
                    </span>

                    <p>
                        Plataforma de Transportes © 2026
                    </p>

                </div>

            </div>

        </section>

    </main>

    <script type="module" src="js/app.js"></script>

</body>
</html>.
