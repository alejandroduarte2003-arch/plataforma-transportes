name: Validate transport platform

on:
  push:
    branches:
      - changes/transport-school-finance-restructure
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-validation:
    name: HTML and JavaScript checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate pages
        run: node scripts/validate-static.mjs
