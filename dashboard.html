
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INCOROVA | Plataforma de Transportes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --negro: #111827;
            --azul: #172554;
            --blanco: #ffffff;
            --gris: #f3f4f6;
            --gris-texto: #6b7280;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--gris);
            color: var(--negro);
            min-height: 100vh;
        }

        header {
            background: var(--azul);
            color: var(--blanco);
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #userEmail {
            font-size: 13px;
        }

        #logoutButton {
            background: var(--blanco);
            color: var(--azul);
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        main {
            padding: 35px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--gris-texto);
        }

        .dashboard-content {
            background: var(--blanco);
            padding: 30px;
            border-radius: 10px;
            min-height: 250px;
        }

        #loadingMessage {
            text-align: center;
            padding: 60px 20px;
            color: var(--gris-texto);
        }

        @media (max-width: 600px) {
            header {
                padding: 15px;
            }

            main {
                padding: 20px;
            }

            .header-right {
                gap: 10px;
            }

            #userEmail {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">INCOROVA</div>

        <div class="header-right">
            <span id="userEmail"></span>
            <button id="logoutButton">Cerrar sesión</button>
        </div>
    </header>

    <main>

        <section class="welcome">
            <h1>Panel principal</h1>
            <p>Plataforma de gestión de transportes</p>
        </section>

        <section class="dashboard-content">
            <div id="loadingMessage">
                Verificando sesión...
            </div>

            <div id="dashboardContent" hidden>
                <h2>Bienvenido a INCOROVA</h2>
                <p>Tu sesión está activa.</p>
            </div>
        </section>

    </main>

    <script type="module">

        import { supabase } from "./js/config.js";

        const userEmail = document.getElementById("userEmail");
        const logoutButton = document.getElementById("logoutButton");
        const loadingMessage = document.getElementById("loadingMessage");
        const dashboardContent = document.getElementById("dashboardContent");

        // VERIFICAR SESIÓN

        async function verifySession() {

            const { data, error } = await supabase.auth.getSession();

            if (error || !data.session) {
                window.location.replace("./index.html");
                return;
            }

            userEmail.textContent = data.session.user.email;

            loadingMessage.hidden = true;
            dashboardContent.hidden = false;
        }

        // CERRAR SESIÓN

        logoutButton.addEventListener("click", async () => {

            logoutButton.disabled = true;

            const { error } = await supabase.auth.signOut();

            if (error) {
                alert("No se pudo cerrar la sesión.");
                logoutButton.disabled = false;
                return;
            }

            window.location.replace("./index.html");

        });

        // DETECTAR CIERRE DE SESIÓN

        supabase.auth.onAuthStateChange((event, session) => {

            if (event === "SIGNED_OUT" || !session) {
                window.location.replace("./index.html");
            }

        });

        // INICIAR

        verifySession();

    </script>

</body>
</html>
